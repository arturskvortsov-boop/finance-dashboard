            // --- ИСПРАВЛЕННАЯ ФУНКЦИЯ ПАРСИНГА rate.json ---
            function parseRateHistory(text) {
                console.log('🔍 Парсим rate.json (новая версия)');
                const lines = text.split('\n').filter(line => line.trim() !== '');
                console.log(`📄 Найдено строк: ${lines.length}`);
                const history = [];
                for (const line of lines) {
                    if (line.toLowerCase().includes('курс')) continue;
                    // Разделяем по | (или ;) – в вашем файле используется |
                    const parts = line.split('|');
                    if (parts.length < 2) continue;
                    const leftPart = parts[0].trim();
                    const rightPart = parts[1].trim();
                    // Извлекаем курс только из правой части
                    const numMatch = rightPart.match(/(\d+[.,]\d+)/);
                    if (!numMatch) continue;
                    const rate = parseFloat(numMatch[1].replace(',', '.'));
                    if (isNaN(rate) || rate <= 0) continue;
                    // Извлекаем дату из левой части
                    const dateMatch = leftPart.match(/(\d{2})\.(\d{2})\.(\d{4})/);
                    if (!dateMatch) continue;
                    const day = parseInt(dateMatch[1]);
                    const month = parseInt(dateMatch[2]) - 1;
                    const year = parseInt(dateMatch[3]);
                    // Время (необязательно)
                    const timeMatch = leftPart.match(/(\d{2}):(\d{2})/);
                    let hour = 0, minute = 0;
                    if (timeMatch) {
                        hour = parseInt(timeMatch[1]);
                        minute = parseInt(timeMatch[2]);
                    }
                    const dateObj = new Date(year, month, day, hour, minute);
                    history.push({ date: dateObj, rate: rate });
                }
                console.log(`📊 Всего записей курса: ${history.length}`);
                history.sort((a, b) => a.date - b.date);
                return history;
            }
